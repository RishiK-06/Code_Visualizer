kind = "web"
previewPath = "/"
title = "Python Visualizer"
description = "An interactive learning tool for exploring Python snippets through step-by-step execution, variable inspection, and live output, all processed in the browser."
version = "1.0.0"
id = "artifacts/python-visualizer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23546

[services.development]
run = "pnpm --filter @workspace/python-visualizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/python-visualizer", "run", "build" ]
serve = "static"
publicDir = "artifacts/python-visualizer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23546"
BASE_PATH = "/"
